name: Test, Build & Deploy Backend

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  verify:
    name: Test and build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: "21"
          distribution: temurin
          cache: maven

      - name: Test
        run: ./mvnw --batch-mode test

      - name: Build
        run: ./mvnw --batch-mode clean package -DskipTests

  deploy-ecs:
    name: Push image to ECR and deploy ECS service
    runs-on: ubuntu-latest
    needs: verify
    if: github.event_name == 'push'
    env:
      AWS_REGION: ${{ vars.AWS_REGION || 'us-east-1' }}
    steps:
      - uses: actions/checkout@v4

      - name: Set up AWS Academy Learner Lab credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-session-token: ${{ secrets.AWS_SESSION_TOKEN }}
          aws-region: ${{ vars.AWS_REGION || 'us-east-1' }}

      - name: Log in to Amazon ECR
        id: ecr-login
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build and push image
        env:
          ECR_REGISTRY: ${{ steps.ecr-login.outputs.registry }}
          ECR_REPOSITORY: biztrips-backend
        run: |
          IMAGE_TAG="$GITHUB_SHA"
          if [[ "$GITHUB_REF_TYPE" == "tag" ]]; then
            IMAGE_TAG="$GITHUB_REF_NAME"
          fi

          docker build \
            -t "$ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG" \
            -t "$ECR_REGISTRY/$ECR_REPOSITORY:$GITHUB_SHA" .
          docker push "$ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG"
          if [[ "$GITHUB_REF_TYPE" == "tag" ]]; then
            docker push "$ECR_REGISTRY/$ECR_REPOSITORY:$GITHUB_SHA"
          else
            docker tag "$ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG" "$ECR_REGISTRY/$ECR_REPOSITORY:latest"
            docker push "$ECR_REGISTRY/$ECR_REPOSITORY:latest"
          fi

      - name: Prepare ECS task definition
        env:
          ECS_EXECUTION_ROLE_ARN: ${{ vars.ECS_EXECUTION_ROLE_ARN }}
          ECS_TASK_ROLE_ARN: ${{ vars.ECS_TASK_ROLE_ARN }}
          ECS_CLUSTER: ${{ vars.ECS_CLUSTER }}
          ECS_SERVICE: ${{ vars.ECS_SERVICE }}
          RDS_HOST: ${{ vars.RDS_HOST }}
          RDS_DB_NAME: ${{ vars.RDS_DB_NAME || 'db_biztrips' }}
          RDS_DB_PORT: ${{ vars.RDS_DB_PORT || '3306' }}
          RDS_USERNAME_SECRET_ARN: ${{ vars.RDS_USERNAME_SECRET_ARN }}
          RDS_PASSWORD_SECRET_ARN: ${{ vars.RDS_PASSWORD_SECRET_ARN }}
          S3_BUCKET: ${{ vars.S3_BUCKET }}
        run: |
          for name in ECS_EXECUTION_ROLE_ARN ECS_TASK_ROLE_ARN ECS_CLUSTER ECS_SERVICE RDS_HOST \
            RDS_USERNAME_SECRET_ARN RDS_PASSWORD_SECRET_ARN S3_BUCKET; do
            if [[ -z "${!name}" ]]; then
              echo "::error::Repository variable $name is required"
              exit 1
            fi
          done

          jq \
            --arg executionRole "$ECS_EXECUTION_ROLE_ARN" \
            --arg taskRole "$ECS_TASK_ROLE_ARN" \
            --arg region "$AWS_REGION" \
            --arg dbHost "$RDS_HOST" \
            --arg dbPort "$RDS_DB_PORT" \
            --arg dbName "$RDS_DB_NAME" \
            --arg usernameSecret "$RDS_USERNAME_SECRET_ARN" \
            --arg passwordSecret "$RDS_PASSWORD_SECRET_ARN" \
            --arg bucket "$S3_BUCKET" \
            '.executionRoleArn = $executionRole
             | .taskRoleArn = $taskRole
             | .containerDefinitions |= map(
                 if .name == "biztrips-backend" then
                   .environment = [
                     {"name":"SPRING_PROFILES_ACTIVE","value":"mariadb,s3"},
                     {"name":"DB_HOST","value":$dbHost},
                     {"name":"DB_PORT","value":$dbPort},
                     {"name":"DB_NAME","value":$dbName},
                     {"name":"APP_S3_BUCKET","value":$bucket},
                     {"name":"APP_AWS_REGION","value":$region}
                   ]
                   | .secrets = [
                     {"name":"DB_USERNAME","valueFrom":$usernameSecret},
                     {"name":"DB_PASSWORD","valueFrom":$passwordSecret}
                   ]
                   | .logConfiguration.options["awslogs-region"] = $region
                 else . end
               )' task-definition.json > "$RUNNER_TEMP/task-definition.json"

      - name: Render task definition with the new image
        id: render-task-def
        uses: aws-actions/amazon-ecs-render-task-definition@v1
        with:
          task-definition: ${{ runner.temp }}/task-definition.json
          container-name: biztrips-backend
          image: ${{ steps.ecr-login.outputs.registry }}/biztrips-backend:${{ github.ref_type == 'tag' && github.ref_name || github.sha }}

      - name: Deploy ECS service
        uses: aws-actions/amazon-ecs-deploy-task-definition@v2
        with:
          task-definition: ${{ steps.render-task-def.outputs.task-definition }}
          cluster: ${{ vars.ECS_CLUSTER }}
          service: ${{ vars.ECS_SERVICE }}
          wait-for-service-stability: true
